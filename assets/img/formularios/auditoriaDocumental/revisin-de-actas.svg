<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- DASHBOARD PRINCIPAL (capa trasera, se dibuja primero) -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- HEADER SUPERIOR / CÁMARA WEB (capa frontal, se dibuja después para quedar encima) -->
  <rect x="165" y="82" width="182" height="36" rx="10" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="100" r="9" fill="#FFFFFF"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- ACTA CON REVISIÓN -->
  <!-- Documento de acta -->
  <rect x="175" y="145" width="120" height="140" rx="4" fill="#FFFFFF"/>
  
  <!-- Encabezado del acta -->
  <rect x="185" y="155" width="100" height="12" rx="2" fill="#021A53"/>
  <rect x="195" y="158" width="35" height="6" rx="1" fill="#CFAC65"/>
  
  <!-- Líneas de texto del acta -->
  <rect x="185" y="175" width="90" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="185" y="185" width="80" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="185" y="195" width="85" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="185" y="205" width="70" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="185" y="215" width="75" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="185" y="225" width="60" height="4" rx="1" fill="#D7DBDF"/>
  
  <!-- Sección de firmas -->
  <rect x="185" y="240" width="40" height="3" rx="1" fill="#B3BAC1"/>
  <rect x="185" y="248" width="35" height="3" rx="1" fill="#B3BAC1"/>
  <rect x="245" y="240" width="40" height="3" rx="1" fill="#B3BAC1"/>
  <rect x="245" y="248" width="35" height="3" rx="1" fill="#B3BAC1"/>

  <!-- Escudo con checkmark dorado (revisión aprobada) -->
  <path d="M 275 255 L 275 268 Q 275 278 285 278 Q 295 278 295 268 L 295 255 Z" fill="#CFAC65"/>
  <path d="M 280 266 L 284 270 L 290 262" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Indicador de revisión (lupa pequeña sobre el documento) -->
  <circle cx="255" cy="195" r="15" stroke="#2D67B1" stroke-width="2" fill="none" opacity="0.6"/>
  <line x1="265" y1="205" x2="272" y2="212" stroke="#2D67B1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Documento con check -->
  <rect x="105" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="115" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="115" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 135 372 L 140 377 L 147 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo central: Lupa dorada -->
  <circle cx="256" cy="365" r="28" fill="#CFAC65"/>
  <circle cx="250" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="257" y1="366" x2="264" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Módulo derecho: Certificado/Medalla -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="377" cy="358" r="10" fill="#CFAC65"/>
  <circle cx="377" cy="358" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 370 370 L 368 378 L 377 374 L 386 378 L 384 370 Z" fill="#B89243" opacity="0.8"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>