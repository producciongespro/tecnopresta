<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Alias & Groups Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Central Group -->
  <circle cx="256" cy="182" r="20" fill="white"></circle>

  <!-- Connected Devices -->
  <rect x="188" y="164" width="30" height="22" rx="4" fill="white"></rect>

  <rect x="294" y="164" width="30" height="22" rx="4" fill="white"></rect>

  <rect x="240" y="214" width="30" height="22" rx="4" fill="white"></rect>

  <!-- Connections -->
  <path d="M218 175H236" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <path d="M276 175H294" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <path d="M256 202V214" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <!-- Group Label -->
  <rect x="244" y="176" width="24" height="12" rx="6" fill="url(#mepGoldSoft)"></rect>

</g>

<!-- Educational Group -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Laboratory Group -->
  <circle cx="120" cy="348" r="10" fill="white"></circle>

  <circle cx="98" cy="372" r="8" fill="white" opacity="0.9"></circle>

  <circle cx="142" cy="372" r="8" fill="white" opacity="0.9"></circle>

  <path d="M120 358L98 368" stroke="white" stroke-width="3"></path>

  <path d="M120 358L142 368" stroke="white" stroke-width="3"></path>

</g>

<!-- Alias Registry -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Tags -->
  <path d="M232 336H274L284 346L274 356H232C228 356 224 352 224 348V344C224 340 228 336 232 336Z" fill="white"></path>

  <circle cx="236" cy="346" r="3" fill="url(#mepBlue)"></circle>

  <path d="M232 370H266L276 380L266 390H232C228 390 224 386 224 382V378C224 374 228 370 232 370Z" fill="white"></path>

  <circle cx="236" cy="380" r="3" fill="url(#mepBlue)"></circle>

  <!-- Gold Identifier -->
  <circle cx="278" cy="408" r="10" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Multiple Technology Groups -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Four Group Nodes -->
  <circle cx="374" cy="344" r="8" fill="white"></circle>

  <circle cx="406" cy="344" r="8" fill="white"></circle>

  <circle cx="374" cy="376" r="8" fill="white"></circle>

  <circle cx="406" cy="376" r="8" fill="white"></circle>

  <!-- Center Hub -->
  <circle cx="390" cy="360" r="6" fill="url(#mepGoldSoft)"></circle>

  <!-- Connections -->
  <path d="M390 360L374 344" stroke="white" stroke-width="3"></path>

  <path d="M390 360L406 344" stroke="white" stroke-width="3"></path>

  <path d="M390 360L374 376" stroke="white" stroke-width="3"></path>

  <path d="M390 360L406 376" stroke="white" stroke-width="3"></path>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>