<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Color Catalog Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Color Palette -->
  <circle cx="256" cy="184" r="42" fill="white"></circle>

  <!-- Color Spots -->
  <circle cx="238" cy="170" r="8" fill="#164687"></circle>

  <circle cx="274" cy="166" r="8" fill="#D2B06C"></circle>

  <circle cx="286" cy="194" r="8" fill="#B3BAC1"></circle>

  <circle cx="250" cy="206" r="8" fill="#2B5DA1"></circle>

  <circle cx="228" cy="190" r="8" fill="#6F7D8A"></circle>

  <!-- Brush -->
  <path d="M288 214L314 238" stroke="url(#mepGoldSoft)" stroke-width="8" stroke-linecap="round"></path>

  <circle cx="320" cy="244" r="6" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Assigned Colors -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Swatches -->
  <rect x="96" y="336" width="20" height="20" rx="4" fill="#164687"></rect>

  <rect x="124" y="336" width="20" height="20" rx="4" fill="#D2B06C"></rect>

  <rect x="96" y="364" width="20" height="20" rx="4" fill="#B3BAC1"></rect>

  <rect x="124" y="364" width="20" height="20" rx="4" fill="white"></rect>

</g>

<!-- Color Registry -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Catalog Sheet -->
  <rect x="232" y="330" width="48" height="66" rx="8" fill="white"></rect>

  <!-- Color Entries -->
  <circle cx="244" cy="348" r="4" fill="#164687"></circle>

  <rect x="252" y="344" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <circle cx="244" cy="364" r="4" fill="#D2B06C"></circle>

  <rect x="252" y="360" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <circle cx="244" cy="380" r="4" fill="#B3BAC1"></circle>

  <rect x="252" y="376" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- Selection Indicator -->
  <circle cx="256" cy="410" r="10" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Technology Equipment Color -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Laptop -->
  <rect x="366" y="338" width="48" height="30" rx="5" fill="white"></rect>

  <rect x="360" y="372" width="60" height="8" rx="4" fill="white"></rect>

  <!-- Color Badge -->
  <circle cx="414" cy="336" r="10" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>