<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Financial Source Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Project Folder -->
  <path d="M176 156H230L242 170H336V224C336 232 330 238 322 238H176C168 238 162 232 162 224V170C162 162 168 156 176 156Z" fill="white"></path>

  <!-- Funding Flow -->
  <circle cx="208" cy="196" r="12" fill="url(#mepGoldSoft)"></circle>

  <path d="M224 196H272" stroke="url(#mepBlue)" stroke-width="5" stroke-linecap="round"></path>

  <path d="M262 188L274 196L262 204" stroke="url(#mepBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Technology Asset -->
  <rect x="286" y="182" width="30" height="22" rx="4" fill="url(#mepBlueSoft)"></rect>

  <rect x="282" y="208" width="38" height="5" rx="2" fill="url(#mepBlueSoft)"></rect>

</g>

<!-- Budget Source -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Coin -->
  <circle cx="120" cy="360" r="24" fill="url(#mepGoldSoft)"></circle>

  <circle cx="120" cy="360" r="16" stroke="white" stroke-width="3"></circle>

  <path d="M120 348V372" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M112 352H126" stroke="white" stroke-width="3" stroke-linecap="round"></path>

</g>

<!-- Funding Registry -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Document -->
  <rect x="232" y="332" width="48" height="66" rx="8" fill="white"></rect>

  <rect x="242" y="346" width="26" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="360" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="374" width="22" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- Budget Seal -->
  <circle cx="256" cy="410" r="11" fill="url(#mepGoldSoft)"></circle>

  <path d="M252 410L255 413L261 406" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Program / Project Funding -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Institution -->
  <path d="M390 332L362 346H418L390 332Z" fill="white"></path>

  <rect x="370" y="348" width="8" height="24" rx="2" fill="white"></rect>

  <rect x="386" y="348" width="8" height="24" rx="2" fill="white"></rect>

  <rect x="402" y="348" width="8" height="24" rx="2" fill="white"></rect>

  <rect x="360" y="376" width="60" height="6" rx="3" fill="white"></rect>

  <!-- Funding Indicator -->
  <circle cx="420" cy="330" r="10" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>