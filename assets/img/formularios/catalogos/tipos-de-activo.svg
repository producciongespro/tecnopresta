<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Asset Catalog Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Laptop -->
  <rect x="182" y="148" width="58" height="40" rx="6" fill="white"></rect>

  <rect x="176" y="190" width="70" height="8" rx="4" fill="white"></rect>

  <!-- Tablet -->
  <rect x="250" y="144" width="34" height="52" rx="6" fill="#D7DBDF"></rect>

  <circle cx="267" cy="188" r="2.5" fill="url(#mepBlue)"></circle>

  <!-- Smartphone -->
  <rect x="296" y="150" width="22" height="42" rx="5" fill="#D2B06C"></rect>

  <circle cx="307" cy="184" r="2" fill="white"></circle>

  <!-- Catalog Lines -->
  <rect x="184" y="214" width="120" height="8" rx="4" fill="white" opacity="0.9"></rect>

</g>

<!-- Desktop Equipment -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="94" y="336" width="52" height="32" rx="5" fill="white"></rect>

  <rect x="114" y="370" width="12" height="8" rx="3" fill="white"></rect>

  <rect x="102" y="378" width="36" height="6" rx="3" fill="white"></rect>

</g>

<!-- Asset Registry -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Inventory Card -->
  <rect x="232" y="332" width="48" height="62" rx="8" fill="white"></rect>

  <rect x="242" y="346" width="28" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="360" width="22" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="374" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- Asset Tag -->
  <circle cx="278" cy="406" r="10" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Asset Categories -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Grid -->
  <rect x="370" y="340" width="16" height="16" rx="3" fill="white"></rect>

  <rect x="394" y="340" width="16" height="16" rx="3" fill="white"></rect>

  <rect x="370" y="364" width="16" height="16" rx="3" fill="white"></rect>

  <rect x="394" y="364" width="16" height="16" rx="3" fill="white"></rect>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>