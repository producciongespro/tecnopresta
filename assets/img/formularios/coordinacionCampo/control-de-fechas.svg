<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta Institucional MEP -->

  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard Principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Cronograma Principal -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Calendario -->

  <rect x="168" y="142" width="90" height="78" rx="8" fill="white"></rect>

  <rect x="168" y="142" width="90" height="18" rx="8" fill="url(#mepGold)"></rect>

  <circle cx="188" cy="151" r="3" fill="white"></circle>
  <circle cx="238" cy="151" r="3" fill="white"></circle>

  <!-- Día programado -->

  <rect x="202" y="178" width="22" height="22" rx="4" fill="url(#mepBlueSoft)"></rect>

  <path d="M208 189L214 195L220 183" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Línea de tiempo -->

  <circle cx="302" cy="164" r="8" fill="white"></circle>
  <circle cx="332" cy="194" r="8" fill="white"></circle>

  <path d="M302 164L332 194" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <!-- Reloj -->

  <circle cx="300" cy="206" r="16" fill="url(#mepGold)"></circle>

  <circle cx="300" cy="206" r="8" stroke="white" stroke-width="2"></circle>

  <path d="M300 206V201" stroke="white" stroke-width="2" stroke-linecap="round"></path>

  <path d="M300 206L304 209" stroke="white" stroke-width="2" stroke-linecap="round"></path>

</g>

<!-- Programación -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="98" y="334" width="44" height="48" rx="6" fill="white"></rect>

  <rect x="98" y="334" width="44" height="12" rx="6" fill="url(#mepGold)"></rect>

  <path d="M108 356H132" stroke="url(#mepBlueSoft)" stroke-width="3" stroke-linecap="round"></path>

  <path d="M120 344V368" stroke="url(#mepBlueSoft)" stroke-width="3" stroke-linecap="round"></path>

</g>

<!-- Gestión de Cronogramas -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <rect x="232" y="332" width="48" height="64" rx="6" fill="white"></rect>

  <rect x="242" y="346" width="24" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="242" y="358" width="18" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="242" y="370" width="22" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Seguimiento de Fechas -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <circle cx="386" cy="354" r="16" stroke="white" stroke-width="4"></circle>

  <path d="M398 366L410 378" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <rect x="374" y="382" width="28" height="6" rx="3" fill="white"></rect>

  <circle cx="410" cy="338" r="8" fill="url(#mepGold)"></circle>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja Institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>