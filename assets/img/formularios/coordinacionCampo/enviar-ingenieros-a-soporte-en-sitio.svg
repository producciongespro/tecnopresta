<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta Institucional MEP -->

  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard Principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header Superior -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Ticket Escalado Nivel 3 -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Ticket -->

  <rect x="168" y="144" width="70" height="78" rx="8" fill="white"></rect>

  <rect x="182" y="162" width="40" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="182" y="176" width="28" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="182" y="190" width="34" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <!-- Nivel 3 -->

  <circle cx="202" cy="208" r="12" fill="url(#mepGold)"></circle>

  <text x="198" y="213" font-family="Arial" font-size="11" font-weight="bold" fill="white">3</text>

  <!-- Flecha Escalamiento -->

  <path d="M248 182H308" stroke="white" stroke-width="5" stroke-linecap="round"></path>

  <path d="M296 170L314 182L296 194" fill="white"></path>

  <!-- Técnico en Sitio -->

  <circle cx="322" cy="170" r="12" fill="white"></circle>

  <circle cx="322" cy="166" r="3" fill="url(#mepBlueSoft)"></circle>

  <path d="M315 178
           C317 174 319 173 322 173
           C325 173 327 174 329 178" stroke="url(#mepBlueSoft)" stroke-width="2" stroke-linecap="round"></path>

  <!-- Centro Educativo -->

  <path d="M304 198
           L286 210
           V228
           H322
           V210
           Z" fill="white"></path>

  <rect x="300" y="214" width="8" height="14" rx="1.5" fill="url(#mepBlueSoft)"></rect>

</g>

<!-- Tickets -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="98" y="336" width="42" height="50" rx="6" fill="white"></rect>

  <rect x="106" y="350" width="24" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="106" y="360" width="18" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="106" y="370" width="22" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <circle cx="144" cy="336" r="10" fill="url(#mepGold)"></circle>

</g>

<!-- Escalamiento -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <path d="M236 348H276" stroke="url(#mepBlueSoft)" stroke-width="4" stroke-linecap="round"></path>

  <path d="M264 336L282 348L264 360" fill="url(#mepBlueSoft)"></path>

  <rect x="236" y="378" width="40" height="8" rx="4" fill="url(#mepBlueSoft)"></rect>

  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

</g>

<!-- Soporte en Sitio -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <path d="M392 326
           L366 344
           V392
           H418
           V344
           Z" fill="white"></path>

  <rect x="386" y="358" width="12" height="22" rx="2" fill="url(#mepBlueSoft)"></rect>

  <circle cx="392" cy="334" r="8" fill="url(#mepGold)"></circle>

</g>

<!-- Base Institucional -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja Corporativa -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>