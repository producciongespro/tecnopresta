<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta MEP -->

  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#BFC5CB"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Marco principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Cabecera -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Panel principal -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Ticket -->

  <rect x="166" y="146" width="64" height="74" rx="8" fill="white"></rect>

  <rect x="178" y="162" width="36" height="4" rx="2" fill="#164687"></rect>
  <rect x="178" y="174" width="28" height="4" rx="2" fill="#164687"></rect>
  <rect x="178" y="186" width="40" height="4" rx="2" fill="#164687"></rect>

  <!-- Flecha asignación -->

  <path d="M240 182H286" stroke="white" stroke-width="5" stroke-linecap="round"></path>

  <path d="M276 170L292 182L276 194" fill="white"></path>

  <!-- Técnico asignado -->

  <circle cx="320" cy="164" r="16" fill="white"></circle>

  <circle cx="320" cy="158" r="5" fill="url(#mepBlueSoft)"></circle>

  <path d="M310 176
           C314 170 317 168 320 168
           C323 168 326 170 330 176" stroke="url(#mepBlueSoft)" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Identificador de asignación -->

  <circle cx="320" cy="210" r="14" fill="url(#mepGold)"></circle>

  <path d="M314 210L319 215L327 205" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Tickets pendientes -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="98" y="336" width="44" height="52" rx="6" fill="white"></rect>

  <rect x="106" y="350" width="24" height="3" rx="2" fill="#164687"></rect>
  <rect x="106" y="362" width="18" height="3" rx="2" fill="#164687"></rect>
  <rect x="106" y="374" width="28" height="3" rx="2" fill="#164687"></rect>

  <circle cx="144" cy="336" r="10" fill="url(#mepGold)"></circle>

</g>

<!-- Proceso de asignación -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <circle cx="256" cy="348" r="10" fill="white"></circle>

  <circle cx="256" cy="382" r="10" fill="white"></circle>

  <path d="M256 358V372" stroke="#164687" stroke-width="3" stroke-linecap="round"></path>

  <path d="M250 366L256 372L262 366" stroke="#164687" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

</g>

<!-- Equipo técnico -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <circle cx="392" cy="344" r="10" fill="white"></circle>

  <circle cx="374" cy="378" r="8" fill="white"></circle>

  <circle cx="410" cy="378" r="8" fill="white"></circle>

  <path d="M392 354L374 370" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M392 354L410 370" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>