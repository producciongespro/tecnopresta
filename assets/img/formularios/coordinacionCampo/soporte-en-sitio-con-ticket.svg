<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta Institucional MEP -->

  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#BFC5CB"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Marco principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Cabecera -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Panel principal -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Calendario -->

  <rect x="170" y="142" width="72" height="84" rx="10" fill="white"></rect>

  <rect x="170" y="142" width="72" height="20" rx="10" fill="url(#mepGold)"></rect>

  <circle cx="188" cy="152" r="3" fill="white"></circle>
  <circle cx="224" cy="152" r="3" fill="white"></circle>

  <!-- Día programado -->

  <circle cx="206" cy="190" r="12" fill="url(#mepBlueSoft)"></circle>

  <text x="201" y="195" font-family="Arial" font-size="10" font-weight="bold" fill="white">15</text>

  <!-- Flecha programación -->

  <path d="M248 184H292" stroke="white" stroke-width="5" stroke-linecap="round"></path>

  <path d="M282 172L298 184L282 196" fill="white"></path>

  <!-- Centro educativo programado -->

  <path d="M316 154
           L292 170
           V220
           H340
           V170
           Z" fill="white"></path>

  <rect x="312" y="188" width="10" height="18" rx="2" fill="url(#mepBlueSoft)"></rect>

  <!-- Indicador de cita -->

  <circle cx="332" cy="154" r="12" fill="url(#mepGold)"></circle>

  <path d="M327 154L331 158L337 150" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Agenda de visitas -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="96" y="336" width="48" height="52" rx="8" fill="white"></rect>

  <rect x="96" y="336" width="48" height="12" rx="6" fill="url(#mepGold)"></rect>

  <rect x="106" y="358" width="26" height="3" rx="2" fill="#164687"></rect>
  <rect x="106" y="370" width="18" height="3" rx="2" fill="#164687"></rect>

</g>

<!-- Cronograma -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <rect x="230" y="334" width="52" height="8" rx="4" fill="white"></rect>

  <rect x="230" y="354" width="38" height="8" rx="4" fill="white"></rect>

  <rect x="230" y="374" width="44" height="8" rx="4" fill="white"></rect>

  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Técnico en visita -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <circle cx="392" cy="342" r="12" fill="white"></circle>

  <circle cx="392" cy="338" r="4" fill="url(#mepBlueSoft)"></circle>

  <path d="M384 352
           C387 347 389 346 392 346
           C395 346 397 347 400 352" stroke="url(#mepBlueSoft)" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Reloj -->

  <circle cx="420" cy="376" r="10" fill="url(#mepGold)"></circle>

  <path d="M420 371V376L424 379" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>