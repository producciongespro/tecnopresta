<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta MEP -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- ACTA DE RECEPCIÓN -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Documento principal -->

  <rect x="178" y="144" width="72" height="84" rx="8" fill="white"></rect>

  <path d="M236 144V162H250" stroke="url(#mepBlueSoft)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

  <rect x="192" y="170" width="42" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="192" y="182" width="34" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="192" y="194" width="40" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <!-- Equipo tecnológico -->

  <rect x="286" y="154" width="42" height="28" rx="4" fill="white"></rect>

  <rect x="291" y="159" width="32" height="18" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="280" y="184" width="54" height="6" rx="3" fill="white"></rect>

  <!-- Flecha entrega -->

  <circle cx="268" cy="188" r="16" fill="url(#mepGold)"></circle>

  <path d="M260 188H274" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M270 183L276 188L270 193" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Subir Acta -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="96" y="334" width="48" height="58" rx="8" fill="white"></rect>

  <path d="M120 344V370" stroke="url(#mepBlueSoft)" stroke-width="3" stroke-linecap="round"></path>

  <path d="M112 352L120 344L128 352" stroke="url(#mepBlueSoft)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

  <rect x="108" y="374" width="24" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

</g>

<!-- Administración de Actas -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <rect x="232" y="334" width="48" height="60" rx="6" fill="white"></rect>

  <rect x="242" y="348" width="26" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="242" y="358" width="20" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="242" y="368" width="24" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <!-- Sello -->

  <circle cx="280" cy="394" r="10" fill="url(#mepGold)"></circle>

  <path d="M275 394L279 398L286 390" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Consulta y Recepción -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Documento -->

  <rect x="372" y="334" width="34" height="44" rx="5" fill="white"></rect>

  <rect x="380" y="348" width="18" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="380" y="358" width="14" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <!-- Validación -->

  <circle cx="416" cy="386" r="12" fill="url(#mepGold)"></circle>

  <path d="M411 386L415 390L422 382" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja Institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>