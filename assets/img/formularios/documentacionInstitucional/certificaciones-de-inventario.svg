<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta Institucional MEP -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard Principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Certificación Principal -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Certificado -->

  <rect x="176" y="140" width="90" height="88" rx="10" fill="white"></rect>

  <rect x="194" y="164" width="54" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="194" y="176" width="42" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>
  <rect x="194" y="188" width="48" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <!-- Sello de certificación -->

  <circle cx="248" cy="206" r="14" fill="url(#mepGold)"></circle>

  <path d="M242 206L247 211L255 201" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Equipos inventariados -->

  <rect x="292" y="148" width="38" height="24" rx="4" fill="white"></rect>

  <rect x="296" y="152" width="30" height="16" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="286" y="174" width="50" height="5" rx="2.5" fill="white"></rect>

  <!-- Tablet -->

  <rect x="300" y="190" width="24" height="34" rx="4" fill="white"></rect>

  <rect x="304" y="196" width="16" height="20" rx="2" fill="url(#mepBlueSoft)"></rect>

  <circle cx="312" cy="220" r="1.8" fill="url(#mepBlueSoft)"></circle>

</g>

<!-- Generar Certificación -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="96" y="334" width="48" height="58" rx="8" fill="white"></rect>

  <rect x="106" y="350" width="28" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="106" y="362" width="22" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <circle cx="148" cy="336" r="10" fill="url(#mepGold)"></circle>

  <path d="M148 330V342" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M142 336H154" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

</g>

<!-- Validación / Certificación -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <path d="M256 328L282 338V360C282 376 271 388 256 394C241 388 230 376 230 360V338L256 328Z" fill="white"></path>

  <path d="M246 360L253 367L267 350" stroke="url(#mepBlueSoft)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>

  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Consulta de Certificaciones -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Documento -->

  <rect x="370" y="334" width="36" height="46" rx="5" fill="white"></rect>

  <rect x="378" y="348" width="18" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>
  <rect x="378" y="358" width="14" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <!-- Sello -->

  <circle cx="418" cy="386" r="12" fill="url(#mepGold)"></circle>

  <path d="M412 386L417 391L425 381" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja Institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>