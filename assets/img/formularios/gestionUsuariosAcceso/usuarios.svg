<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta MEP -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2E6AB6"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Panel Principal -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Directorio de Usuarios -->
  <rect x="176" y="144" width="160" height="78" rx="10" fill="white"></rect>

  <!-- Avatar 1 -->
  <circle cx="204" cy="170" r="10" fill="url(#mepBlueSoft)"></circle>
  <rect x="194" y="184" width="20" height="10" rx="5" fill="url(#mepBlueSoft)"></rect>

  <!-- Avatar 2 -->
  <circle cx="256" cy="170" r="10" fill="url(#mepBlueSoft)"></circle>
  <rect x="246" y="184" width="20" height="10" rx="5" fill="url(#mepBlueSoft)"></rect>

  <!-- Avatar 3 -->
  <circle cx="308" cy="170" r="10" fill="url(#mepBlueSoft)"></circle>
  <rect x="298" y="184" width="20" height="10" rx="5" fill="url(#mepBlueSoft)"></rect>

  <!-- Líneas de directorio -->
  <rect x="192" y="206" width="56" height="4" rx="2" fill="#C9D4E6"></rect>
  <rect x="264" y="206" width="40" height="4" rx="2" fill="#C9D4E6"></rect>

  <!-- CRUD -->
  <circle cx="322" cy="150" r="15" fill="url(#mepGold)"></circle>

  <path d="M322 143V157" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M315 150H329" stroke="white" stroke-width="3" stroke-linecap="round"></path>

</g>

<!-- Crear Usuario -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <circle cx="120" cy="346" r="14" fill="white"></circle>

  <path d="M100 388C104 370 111 364 120 364C129 364 136 370 140 388" fill="white"></path>

  <circle cx="146" cy="336" r="10" fill="url(#mepGold)"></circle>

  <path d="M146 331V341" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M141 336H151" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

</g>

<!-- Edición -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <rect x="230" y="330" width="52" height="72" rx="8" fill="white"></rect>

  <rect x="240" y="344" width="28" height="5" rx="2.5" fill="url(#mepBlueSoft)"></rect>

  <rect x="240" y="358" width="20" height="5" rx="2.5" fill="url(#mepBlueSoft)"></rect>

  <rect x="240" y="372" width="24" height="5" rx="2.5" fill="url(#mepBlueSoft)"></rect>

  <!-- Lápiz -->
  <circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

  <path d="M278 412L286 404" stroke="white" stroke-width="2.3" stroke-linecap="round"></path>

</g>

<!-- Gestión de Usuarios -->
<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Engranaje -->
  <circle cx="392" cy="360" r="18" fill="white"></circle>

  <circle cx="392" cy="360" r="6" fill="url(#mepBlueSoft)"></circle>

  <path d="M392 336V344M392 376V384M368 360H376M408 360H416" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <path d="M376 344L382 350M402 370L408 376M408 344L402 350M382 370L376 376" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <!-- Indicador -->
  <circle cx="420" cy="336" r="9" fill="url(#mepGold)"></circle>

</g>

<!-- Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Barra decorativa -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>