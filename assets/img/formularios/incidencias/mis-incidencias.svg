<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Azul institucional -->
  <linearGradient id="blueMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#192952"></stop>
    <stop offset="100%" stop-color="#0035A0"></stop>
  </linearGradient>

  <!-- Dorado institucional -->
  <linearGradient id="goldMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#F2DAB1"></stop>
  </linearGradient>

  <!-- Fondo claro -->
  <linearGradient id="lightMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"></stop>
    <stop offset="100%" stop-color="#F8FAFC"></stop>
  </linearGradient>

  <!-- sombra -->
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.16"></feDropShadow>
  </filter>

</defs>

<!-- CONTENEDOR PRINCIPAL -->
<g filter="url(#shadow)">

  <!-- Fondo -->
  <rect x="92" y="78" width="328" height="348" rx="32" fill="url(#blueMain)"></rect>

  <!-- Interior -->
  <rect x="118" y="104" width="276" height="296" rx="24" fill="url(#lightMain)"></rect>

</g>

<!-- HEADER -->
<g filter="url(#shadow)">

  <rect x="188" y="54" width="136" height="54" rx="16" fill="url(#blueMain)"></rect>

  <circle cx="256" cy="81" r="7" fill="white"></circle>

</g>

<!-- PANEL DASHBOARD -->
<g filter="url(#shadow)">

  <rect x="145" y="145" width="222" height="190" rx="22" fill="white" stroke="#D9D9D9" stroke-width="3"></rect>

</g>

<!-- AVATAR -->
<g filter="url(#shadow)">

  <!-- cabeza -->
  <circle cx="185" cy="190" r="24" fill="url(#goldMain)"></circle>

  <!-- cuerpo -->
  <rect x="160" y="218" width="50" height="30" rx="15" fill="url(#blueMain)"></rect>

</g>

<!-- TICKETS -->
<g>

  <!-- ticket activo -->
  <rect x="230" y="168" width="110" height="34" rx="10" fill="#E8EEF9"></rect>

  <circle cx="248" cy="185" r="6" fill="#0035A0"></circle>

  <rect x="262" y="181" width="58" height="8" rx="4" fill="#CBD5E1"></rect>

  <!-- ticket revisión -->
  <rect x="230" y="218" width="110" height="34" rx="10" fill="#FFF5E6"></rect>

  <circle cx="248" cy="235" r="6" fill="#CFAC65"></circle>

  <rect x="262" y="231" width="48" height="8" rx="4" fill="#D6DCE5"></rect>

  <!-- ticket resuelto -->
  <rect x="230" y="268" width="110" height="34" rx="10" fill="#EAF7EF"></rect>

  <circle cx="248" cy="285" r="6" fill="#2F855A"></circle>

  <rect x="262" y="281" width="64" height="8" rx="4" fill="#CBD5E1"></rect>

</g>

<!-- BADGE HISTORIAL -->
<g filter="url(#shadow)">

  <circle cx="352" cy="145" r="28" fill="url(#goldMain)"></circle>

  <!-- reloj -->
  <circle cx="352" cy="145" r="12" stroke="#192952" stroke-width="5"></circle>

  <path d="M352 145V137" stroke="#192952" stroke-width="5" stroke-linecap="round"></path>

  <path d="M352 145L358 149" stroke="#192952" stroke-width="5" stroke-linecap="round"></path>

</g>

<!-- BADGE SEGUIMIENTO -->
<g filter="url(#shadow)">

  <circle cx="345" cy="350" r="30" fill="url(#blueMain)"></circle>

  <!-- lupa -->
  <circle cx="340" cy="345" r="10" stroke="white" stroke-width="5"></circle>

  <path d="M348 353L358 363" stroke="white" stroke-width="5" stroke-linecap="round"></path>

</g>

<!-- LÍNEAS DECORATIVAS -->
<g>

  <rect x="180" y="360" width="150" height="8" rx="4" fill="#CBD5E1"></rect>

  <rect x="205" y="376" width="100" height="8" rx="4" fill="#E2E8F0"></rect>

</g>

</svg>