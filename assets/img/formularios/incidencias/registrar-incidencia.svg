<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Azul institucional -->
  <linearGradient id="blueMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#192952"></stop>
    <stop offset="100%" stop-color="#0035A0"></stop>
  </linearGradient>

  <!-- Dorado -->
  <linearGradient id="goldMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#F2DAB1"></stop>
  </linearGradient>

  <!-- Fondo claro -->
  <linearGradient id="lightMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"></stop>
    <stop offset="100%" stop-color="#F8FAFC"></stop>
  </linearGradient>

  <!-- sombra -->
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.16"></feDropShadow>
  </filter>

</defs>

<!-- PANEL PRINCIPAL -->
<g filter="url(#shadow)">

  <!-- fondo -->
  <rect x="92" y="78" width="328" height="348" rx="32" fill="url(#blueMain)"></rect>

  <!-- interior -->
  <rect x="118" y="104" width="276" height="296" rx="24" fill="url(#lightMain)"></rect>

</g>

<!-- HEADER -->
<g filter="url(#shadow)">

  <rect x="186" y="54" width="140" height="54" rx="16" fill="url(#blueMain)"></rect>

  <circle cx="256" cy="81" r="7" fill="white"></circle>

</g>

<!-- PANEL DE REGISTRO -->
<g filter="url(#shadow)">

  <rect x="150" y="150" width="212" height="182" rx="22" fill="white" stroke="#D9D9D9" stroke-width="3"></rect>

</g>

<!-- CAMPOS FORMULARIO -->
<g>

  <!-- líneas -->
  <rect x="190" y="182" width="120" height="10" rx="5" fill="#CBD5E1"></rect>
  <rect x="190" y="210" width="90" height="10" rx="5" fill="#E2E8F0"></rect>

  <rect x="190" y="252" width="110" height="10" rx="5" fill="#CBD5E1"></rect>
  <rect x="190" y="280" width="135" height="10" rx="5" fill="#E2E8F0"></rect>

</g>

<!-- ICONOS CHECK -->
<g>

  <circle cx="170" cy="187" r="7" fill="#0035A0"></circle>
  <circle cx="170" cy="257" r="7" fill="#CFAC65"></circle>

</g>

<!-- TICKET CENTRAL -->
<g filter="url(#shadow)">

  <path d="M188 338
           H324
           Q334 338 334 348
           V370
           Q318 375 318 390
           Q318 405 334 410
           V430
           Q334 440 324 440
           H188
           Q178 440 178 430
           V410
           Q194 405 194 390
           Q194 375 178 370
           V348
           Q178 338 188 338Z" fill="url(#goldMain)"></path>

</g>

<!-- SÍMBOLO NUEVO -->
<g filter="url(#shadow)">

  <circle cx="256" cy="388" r="28" fill="url(#blueMain)"></circle>

  <!-- + -->
  <path d="M256 372V404" stroke="white" stroke-width="6" stroke-linecap="round"></path>

  <path d="M240 388H272" stroke="white" stroke-width="6" stroke-linecap="round"></path>

</g>

<!-- BADGE ALERTA -->
<g filter="url(#shadow)">

  <circle cx="346" cy="145" r="28" fill="url(#goldMain)"></circle>

  <!-- triángulo -->
  <path d="M346 126L362 154H330L346 126Z" fill="#192952"></path>

  <!-- ! -->
  <rect x="343" y="137" width="6" height="11" rx="3" fill="white"></rect>

  <circle cx="346" cy="151" r="2.5" fill="white"></circle>

</g>

<!-- LÍNEAS DECORATIVAS -->
<g>

  <rect x="180" y="455" width="150" height="8" rx="4" fill="#CBD5E1"></rect>

  <rect x="205" y="470" width="100" height="8" rx="4" fill="#E2E8F0"></rect>

</g>

</svg>