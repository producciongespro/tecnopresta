<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- DASHBOARD PRINCIPAL (Se dibuja primero para quedar en la capa de atrás) -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- HEADER SUPERIOR / CÁMARA WEB (Se dibuja después para quedar al frente) -->
  <rect x="165" y="82" width="182" height="36" rx="10" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="100" r="9" fill="#FFFFFF"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- MAPA DE CALOR (Grid de puntos) -->
  <g transform="translate(146, 150)">
    <!-- Fila 1 -->
    <circle cx="0" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="25" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="50" cy="0" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="75" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="100" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="125" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="150" cy="0" r="7" fill="#2D67B1" opacity="0.4"/>
    
    <!-- Fila 2 -->
    <circle cx="0" cy="25" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="25" cy="25" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="50" cy="25" r="7" fill="#CFAC65" opacity="0.5"/>
    <circle cx="75" cy="25" r="7" fill="#CFAC65" opacity="0.7"/>
    <circle cx="100" cy="25" r="7" fill="#CFAC65" opacity="0.5"/>
    <circle cx="125" cy="25" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="150" cy="25" r="7" fill="#2D67B1" opacity="0.4"/>

    <!-- Fila 3 (Zona caliente central) -->
    <circle cx="0" cy="50" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="25" cy="50" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="50" cy="50" r="7" fill="#CFAC65" opacity="0.7"/>
    <circle cx="75" cy="50" r="7" fill="#CFAC65" opacity="0.95" filter="url(#glow)"/>
    <circle cx="100" cy="50" r="7" fill="#CFAC65" opacity="0.7"/>
    <circle cx="125" cy="50" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="150" cy="50" r="7" fill="#2D67B1" opacity="0.4"/>

    <!-- Fila 4 -->
    <circle cx="0" cy="75" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="25" cy="75" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="50" cy="75" r="7" fill="#CFAC65" opacity="0.5"/>
    <circle cx="75" cy="75" r="7" fill="#CFAC65" opacity="0.7"/>
    <circle cx="100" cy="75" r="7" fill="#CFAC65" opacity="0.5"/>
    <circle cx="125" cy="75" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="150" cy="75" r="7" fill="#2D67B1" opacity="0.4"/>

    <!-- Fila 5 -->
    <circle cx="0" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="25" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="50" cy="100" r="7" fill="#2D67B1" opacity="0.5"/>
    <circle cx="75" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="100" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="125" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
    <circle cx="150" cy="100" r="7" fill="#2D67B1" opacity="0.4"/>
  </g>

  <!-- Anillo de alerta en la zona caliente -->
  <circle cx="221" cy="200" r="22" stroke="#CFAC65" stroke-width="2" fill="none" stroke-dasharray="4,3" opacity="0.8"/>

  <!-- Icono de equipo (Laptop) en el centro de la zona caliente -->
  <g transform="translate(209, 190)">
    <!-- Pantalla laptop -->
    <rect x="4" y="0" width="16" height="12" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="2" width="12" height="8" rx="1" fill="#164687"/>
    <!-- Base laptop -->
    <rect x="0" y="12" width="24" height="3" rx="1" fill="#D7DBDF"/>
  </g>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Creación (+) -->
  <circle cx="135" cy="365" r="28" fill="#2D67B1"/>
  <path d="M 135 353 L 135 377 M 123 365 L 147 365" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Módulo central: Validación (documento con check) -->
  <rect x="198" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="208" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="208" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 228 372 L 233 377 L 240 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo derecho: Consulta (lupa) -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="371" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="378" y1="366" x2="385" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>