<rect x="280" y="138" width="68" height="48" rx="5" fill="white"/> 
<path d="M288 146 V178 M296 146 V178 M304 146 V178 M312 146 V178 M320 146 V178 M328 146 V178 M336 146 V178" stroke="#164687" stroke-width="4" stroke-linecap="round"/> 
