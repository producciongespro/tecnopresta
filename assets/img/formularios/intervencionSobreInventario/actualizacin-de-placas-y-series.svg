<path d="M134 380 L140 386" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/> 
</g> 

<!-- Edición de Datos del Activo --> 
<g filter="url(#shadow)"> 
<rect x="214" y="312" width="84" height="122" rx="16" fill="url(#gray)"/> 
