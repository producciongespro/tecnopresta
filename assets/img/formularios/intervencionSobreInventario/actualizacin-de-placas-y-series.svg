<!-- Icono de edición superpuesto --> 
<path d="M272 362 L284 350 L288 354 L276 366 Z" fill="url(#gold)"/> 
</g> 

<!-- Actualización Exitosa --> 
<g filter="url(#shadow)"> 
<circle cx="392" cy="360" r="52" fill="url(#blue)"/> 
<!-- Monitor institucional --> 
<rect x="374" y="342" width="36" height="26" rx="3" fill="white"/> 
<rect x="388" y="368" width="8" height="6" fill="#EEF2F6"/> 
<rect x="380" y="374" width="24" height="4" rx="2" fill="#EEF2F6"/> 
<!-- Badge de verificación --> 
<circle cx="404" cy="348" r="10" fill="url(#gold)"/> 
<path d="M400 348 L403 351 L409 344" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> 
</g> 

<!-- Base --> 
<g filter="url(#shadow)"> 
<rect x="168" y="448" width="176" height="28" rx="12" fill="url(#blue)"/> 
</g> 
</svg>