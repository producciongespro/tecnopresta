<path d="M330 170 L348 152 L354 158 L336 176 Z" fill="url(#gold)"/> 
<path d="M348 152 L354 158" stroke="#021A53" stroke-width="2" stroke-linejoin="round"/> 

<!-- Franja inferior: Contexto educativo + actualización de placas --> 
<rect x="160" y="200" width="192" height="34" rx="8" fill="white" opacity=".15"/> 

<!-- Birrete educativo (centro educativo) --> 
<path d="M172 218 L188 210 L204 218 L188 226 Z" fill="white"/> 
<path d="M188 226 V232" stroke="white" stroke-width="2" stroke-linecap="round"/> 
<circle cx="204" cy="222" r="2" fill="url(#gold)"/> 

<!-- Etiqueta de placa con código QR --> 
<rect x="218" y="208" width="26" height="22" rx="3" fill="white"/> 
<rect x="222" y="212" width="6" height="6" fill="#164687"/> 
<rect x="230" y="212" width="4" height="4" fill="#164687"/> 
<rect x="236" y="212" width="4" height="6" fill="#164687"/> 
<rect x="222" y="220" width="4" height="6" fill="#164687"/> 
<rect x="228" y="222" width="6" height="4" fill="#164687"/> 
<rect x="236" y="222" width="4" height="4" fill="#164687"/> 

<!-- Flecha de actualización --> 
<path d="M252 219 H264" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/> 
<path d="M260 214 L268 219 L260 224" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> 

<!-- Escáner / Lector de placas --> 
<rect x="274" y="208" width="28" height="22" rx="4" fill="white"/> 
<rect x="278" y="212" width="20" height="10" rx="2" fill="#164687"/> 
<path d="M280 226 H300" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/> 

<!-- Check de verificación --> 
<circle cx="322" cy="219" r="11" fill="url(#gold)"/> 
<path d="M317 219 L321 223 L328 215" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> 
</g> 

<!-- Búsqueda por Código/Fondo Presupuestario --> 
<g filter="url(#shadow)"> 
<circle cx="120" cy="360" r="52" fill="url(#blue)"/> 
<!-- Documento presupuestario --> 
