<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- HEADER SUPERIOR -->
  <rect x="110" y="35" width="292" height="50" rx="12" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="60" r="12" fill="#FFFFFF"/>

  <!-- DASHBOARD PRINCIPAL -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- CERTIFICACIONES ENTREGADAS -->
  
  <!-- Certificado principal -->
  <rect x="180" y="150" width="130" height="100" rx="5" fill="#FFFFFF"/>
  <!-- Borde decorativo del certificado -->
  <rect x="186" y="156" width="118" height="88" rx="3" fill="none" stroke="#164687" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Encabezado del certificado -->
  <rect x="195" y="165" width="90" height="8" rx="1" fill="#021A53"/>
  <rect x="205" y="167" width="30" height="4" rx="1" fill="#CFAC65"/>
  
  <!-- Líneas de texto del certificado -->
  <rect x="195" y="180" width="80" height="3" rx="1" fill="#D7DBDF"/>
  <rect x="195" y="188" width="70" height="3" rx="1" fill="#D7DBDF"/>
  <rect x="195" y="196" width="75" height="3" rx="1" fill="#D7DBDF"/>
  <rect x="195" y="204" width="60" height="3" rx="1" fill="#D7DBDF"/>
  
  <!-- Sello institucional dorado con cinta -->
  <circle cx="245" cy="225" r="12" fill="#CFAC65"/>
  <circle cx="245" cy="225" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Cintas del sello -->
  <path d="M 238 235 L 235 245 L 245 240 L 255 245 L 252 235 Z" fill="#B89243" opacity="0.8"/>

  <!-- Badge de "Entregada" (Checkmark) en la esquina superior derecha -->
  <circle cx="310" cy="160" r="22" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="310" cy="160" r="18" fill="none" stroke="#021A53" stroke-width="2"/>
  <path d="M 302 160 L 308 166 L 318 154" stroke="#CFAC65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Indicadores de entrega completada (puntos dorados en fila) -->
  <circle cx="210" cy="245" r="3" fill="#CFAC65"/>
  <circle cx="225" cy="245" r="3" fill="#CFAC65"/>
  <circle cx="240" cy="245" r="3" fill="#CFAC65"/>
  <circle cx="255" cy="245" r="3" fill="#CFAC65"/>
  <circle cx="270" cy="245" r="3" fill="#CFAC65"/>

  <!-- Línea de conexión sutil (flujo de entrega) -->
  <line x1="150" y1="200" x2="180" y2="200" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="310" y1="200" x2="340" y2="200" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Creación (+) -->
  <circle cx="135" cy="365" r="28" fill="#2D67B1"/>
  <path d="M 135 353 L 135 377 M 123 365 L 147 365" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Módulo central: Validación (documento con check) -->
  <rect x="198" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="208" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="208" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 228 372 L 233 377 L 240 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo derecho: Consulta (lupa) -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="371" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="378" y1="366" x2="385" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>