<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- HEADER SUPERIOR -->
  <rect x="110" y="35" width="292" height="50" rx="12" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="60" r="12" fill="#FFFFFF"/>

  <!-- DASHBOARD PRINCIPAL -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- CERTIFICACIONES PENDIENTES -->
  
  <!-- Certificado trasero (inclinado) -->
  <g transform="rotate(-8 230 200)">
    <rect x="175" y="155" width="110" height="80" rx="4" fill="#2D67B1" opacity="0.5"/>
    <rect x="185" y="165" width="90" height="6" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="185" y="177" width="70" height="4" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="185" y="186" width="80" height="4" rx="1" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Certificado medio (inclinado) -->
  <g transform="rotate(-3 240 210)">
    <rect x="185" y="168" width="110" height="80" rx="4" fill="#2D67B1" opacity="0.75"/>
    <rect x="195" y="178" width="90" height="6" rx="1" fill="#FFFFFF" opacity="0.5"/>
    <rect x="195" y="190" width="70" height="4" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="195" y="199" width="80" height="4" rx="1" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Certificado frontal (principal) -->
  <rect x="200" y="175" width="110" height="85" rx="4" fill="#FFFFFF"/>
  <!-- Borde decorativo del certificado -->
  <rect x="206" y="181" width="98" height="73" rx="2" fill="none" stroke="#164687" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Encabezado del certificado -->
  <rect x="215" y="188" width="80" height="8" rx="1" fill="#021A53"/>
  <rect x="225" y="190" width="25" height="4" rx="1" fill="#CFAC65"/>
  
  <!-- Líneas de texto del certificado -->
  <rect x="215" y="203" width="70" height="3" rx="1" fill="#D7DBDF"/>
  <rect x="215" y="211" width="60" height="3" rx="1" fill="#D7DBDF"/>
  <rect x="215" y="219" width="65" height="3" rx="1" fill="#D7DBDF"/>
  
  <!-- Sello institucional dorado -->
  <circle cx="275" cy="238" r="11" fill="#CFAC65"/>
  <circle cx="275" cy="238" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 272 238 L 274 240 L 278 235" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Banda de entrega (flecha hacia abajo) -->
  <path d="M 255 260 L 255 280" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 248 274 L 255 281 L 262 274" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Badge de "pendiente" (reloj) -->
  <circle cx="330" cy="160" r="22" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="330" cy="160" r="18" fill="none" stroke="#021A53" stroke-width="2"/>
  <line x1="330" y1="160" x2="330" y2="150" stroke="#021A53" stroke-width="2" stroke-linecap="round"/>
  <line x1="330" y1="160" x2="338" y2="163" stroke="#021A53" stroke-width="2" stroke-linecap="round"/>
  <circle cx="330" cy="160" r="2" fill="#CFAC65"/>

  <!-- Indicadores de cantidad pendiente (puntos dorados) -->
  <circle cx="310" cy="200" r="3" fill="#CFAC65"/>
  <circle cx="320" cy="200" r="3" fill="#CFAC65"/>
  <circle cx="330" cy="200" r="3" fill="#CFAC65"/>
  <circle cx="340" cy="200" r="3" fill="#CFAC65"/>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Creación (+) -->
  <circle cx="135" cy="365" r="28" fill="#2D67B1"/>
  <path d="M 135 353 L 135 377 M 123 365 L 147 365" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Módulo central: Validación (documento con check) -->
  <rect x="198" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="208" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="208" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 228 372 L 233 377 L 240 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo derecho: Consulta (lupa) -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="371" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="378" y1="366" x2="385" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>