<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- HEADER SUPERIOR -->
  <rect x="110" y="35" width="292" height="50" rx="12" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="60" r="12" fill="#FFFFFF"/>

  <!-- DASHBOARD PRINCIPAL -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- REPORTE EJECUTIVO CON COBERTURA NACIONAL -->
  <!-- Documento principal -->
  <rect x="165" y="140" width="110" height="140" rx="5" fill="#FFFFFF"/>
  
  <!-- Encabezado del documento -->
  <rect x="175" y="150" width="90" height="14" rx="2" fill="#021A53"/>
  <rect x="180" y="154" width="30" height="6" rx="1" fill="#CFAC65"/>
  
  <!-- Líneas de texto del reporte -->
  <rect x="175" y="172" width="80" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="175" y="182" width="70" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="175" y="192" width="75" height="4" rx="1" fill="#D7DBDF"/>
  <rect x="175" y="202" width="60" height="4" rx="1" fill="#D7DBDF"/>

  <!-- Gráfico de barras dentro del documento -->
  <rect x="175" y="215" width="14" height="30" rx="1" fill="#2D67B1"/>
  <rect x="193" y="225" width="14" height="20" rx="1" fill="#2D67B1"/>
  <rect x="211" y="210" width="14" height="35" rx="1" fill="#CFAC65"/>
  <rect x="229" y="220" width="14" height="25" rx="1" fill="#2D67B1"/>
  <rect x="247" y="218" width="14" height="27" rx="1" fill="#2D67B1"/>

  <!-- Indicador de cobertura nacional (mapa simplificado con puntos) -->
  <circle cx="340" cy="180" r="38" fill="#2D67B1" opacity="0.3"/>
  <circle cx="340" cy="180" r="28" fill="#2D67B1" opacity="0.5"/>
  
  <!-- Puntos representando regiones/provincias -->
  <circle cx="325" cy="170" r="4" fill="#CFAC65"/>
  <circle cx="340" cy="165" r="4" fill="#CFAC65"/>
  <circle cx="355" cy="172" r="4" fill="#CFAC65"/>
  <circle cx="330" cy="185" r="4" fill="#CFAC65"/>
  <circle cx="350" cy="188" r="4" fill="#CFAC65"/>
  <circle cx="340" cy="195" r="4" fill="#CFAC65"/>
  
  <!-- Líneas de conexión entre puntos (red nacional) -->
  <line x1="325" y1="170" x2="340" y2="165" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="340" y1="165" x2="355" y2="172" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="330" y1="185" x2="350" y2="188" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="340" y1="165" x2="340" y2="195" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="325" y1="170" x2="330" y2="185" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="355" y1="172" x2="350" y2="188" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Creación (+) -->
  <circle cx="135" cy="365" r="28" fill="#2D67B1"/>
  <path d="M 135 353 L 135 377 M 123 365 L 147 365" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Módulo central: Validación (documento con check) -->
  <rect x="198" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="208" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="208" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 228 372 L 233 377 L 240 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo derecho: Consulta (lupa) -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="371" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="378" y1="366" x2="385" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>