<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021A53" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Franja vertical dorada lateral -->
  <rect x="0" y="0" width="12" height="512" fill="#CFAC65" opacity="0.5"/>

  <!-- HEADER SUPERIOR -->
  <rect x="110" y="35" width="292" height="50" rx="12" fill="#021A53" filter="url(#shadow)"/>
  <circle cx="256" cy="60" r="12" fill="#FFFFFF"/>

  <!-- DASHBOARD PRINCIPAL -->
  <rect x="65" y="100" width="382" height="315" rx="16" fill="#FFFFFF" stroke="#021A53" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- PANEL CENTRAL AZUL -->
  <rect x="90" y="125" width="332" height="185" rx="10" fill="#164687"/>

  <!-- INVENTARIO NACIONAL CONCENTRADO -->
  
  <!-- Cajas de inventario (izquierda) -->
  <rect x="120" y="200" width="40" height="35" rx="3" fill="#2D67B1"/>
  <rect x="120" y="200" width="40" height="8" rx="2" fill="#021A53" opacity="0.3"/>
  <line x1="140" y1="200" x2="140" y2="235" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  
  <rect x="125" y="165" width="40" height="35" rx="3" fill="#2D67B1" opacity="0.8"/>
  <rect x="125" y="165" width="40" height="8" rx="2" fill="#021A53" opacity="0.3"/>
  <line x1="145" y1="165" x2="145" y2="200" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <!-- Cajas de inventario (derecha) -->
  <rect x="352" y="200" width="40" height="35" rx="3" fill="#2D67B1"/>
  <rect x="352" y="200" width="40" height="8" rx="2" fill="#021A53" opacity="0.3"/>
  <line x1="372" y1="200" x2="372" y2="235" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  
  <rect x="347" y="165" width="40" height="35" rx="3" fill="#2D67B1" opacity="0.8"/>
  <rect x="347" y="165" width="40" height="8" rx="2" fill="#021A53" opacity="0.3"/>
  <line x1="367" y1="165" x2="367" y2="200" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <!-- Flechas convergentes hacia el centro (concentración) -->
  <path d="M 165 217 L 200 217" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 195 212 L 200 217 L 195 222" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <path d="M 347 217 L 312 217" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 317 212 L 312 217 L 317 222" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Caja central consolidada (más grande) -->
  <rect x="206" y="195" width="100" height="55" rx="5" fill="#FFFFFF"/>
  <rect x="206" y="195" width="100" height="10" rx="3" fill="#021A53"/>
  <rect x="215" y="198" width="25" height="4" rx="1" fill="#CFAC65"/>
  <line x1="256" y1="195" x2="256" y2="250" stroke="#D7DBDF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Indicador de resumen en caja central -->
  <rect x="215" y="215" width="35" height="4" rx="1" fill="#2D67B1"/>
  <rect x="215" y="225" width="30" height="4" rx="1" fill="#2D67B1"/>
  <rect x="265" y="215" width="32" height="4" rx="1" fill="#B3BAC1"/>
  <rect x="265" y="225" width="28" height="4" rx="1" fill="#B3BAC1"/>
  <rect x="215" y="237" width="82" height="6" rx="2" fill="#CFAC65" opacity="0.7"/>

  <!-- Indicadores de cobertura nacional (puntos dorados) -->
  <circle cx="150" cy="150" r="4" fill="#CFAC65"/>
  <circle cx="180" cy="145" r="4" fill="#CFAC65"/>
  <circle cx="210" cy="148" r="4" fill="#CFAC65"/>
  <circle cx="256" cy="143" r="4" fill="#CFAC65"/>
  <circle cx="302" cy="148" r="4" fill="#CFAC65"/>
  <circle cx="332" cy="145" r="4" fill="#CFAC65"/>
  <circle cx="362" cy="150" r="4" fill="#CFAC65"/>

  <!-- Líneas de conexión entre puntos (red nacional) -->
  <line x1="150" y1="150" x2="180" y2="145" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="145" x2="210" y2="148" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
  <line x1="210" y1="148" x2="256" y2="143" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
  <line x1="256" y1="143" x2="302" y2="148" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
  <line x1="302" y1="148" x2="332" y2="145" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
  <line x1="332" y1="145" x2="362" y2="150" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>

  <!-- TRES MÓDULOS INFERIORES SIMPLIFICADOS -->
  <!-- Módulo izquierdo: Creación (+) -->
  <circle cx="135" cy="365" r="28" fill="#2D67B1"/>
  <path d="M 135 353 L 135 377 M 123 365 L 147 365" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Módulo central: Validación (documento con check) -->
  <rect x="198" y="342" width="44" height="46" rx="6" fill="#2D67B1"/>
  <rect x="208" y="352" width="24" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <rect x="208" y="360" width="18" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 228 372 L 233 377 L 240 368" stroke="#CFAC65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Módulo derecho: Consulta (lupa) -->
  <circle cx="377" cy="365" r="28" fill="#2D67B1"/>
  <circle cx="371" cy="359" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <line x1="378" y1="366" x2="385" y2="373" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BASE INFERIOR -->
  <rect x="65" y="420" width="382" height="16" rx="6" fill="#164687"/>
</svg>