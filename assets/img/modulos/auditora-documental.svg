<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#164687"/>
<stop offset="100%" stop-color="#021A53"/>
</linearGradient>

<linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2D67B1"/>
<stop offset="100%" stop-color="#164687"/>
</linearGradient>

<linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#D7B36A"/>
<stop offset="100%" stop-color="#B78B39"/>
</linearGradient>

<linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#E8EDF3"/>
<stop offset="100%" stop-color="#C8D1DC"/>
</linearGradient>

<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"/>
</filter>

</defs>

<!-- Marco -->
<g filter="url(#shadow)">
<rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"/>
</g>

<!-- Encabezado -->
<g filter="url(#shadow)">
<rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"/>
<circle cx="256" cy="67" r="7" fill="white"/>
</g>

<!-- Franja -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.28"/>

