<rect x="242" y="368" width="24" height="3" rx="1.5" fill="#164687"/>

<!-- Folder 3 -->
<path d="M242 372 L256 372 L260 378 L290 378 L290 402 L242 402 Z" fill="white" stroke="#C8D1DC" stroke-width="2"/>
<rect x="250" y="384" width="24" height="3" rx="1.5" fill="#164687"/>

<!-- Sello de Auditoría en carpetas -->
<circle cx="278" cy="396" r="10" fill="url(#mepGold)"/>
<path d="M274 396 L277 399 L283 392" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Círculo Inferior Derecho: Revisión Nacional -->
<g filter="url(#shadow)">
<circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"/>

<!-- Mapa estilizado Costa Rica -->
<path d="M374 360 L381 352 L389 354 L397 347 L405 352 L412 347 L414 356 L408 364 L401 366 L395 374 L386 373 L380 368 Z" fill="white"/>

<!-- Pin de Auditoría Nacional -->
<path d="M392 336 C398 336 403 341 403 347 C403 356 392 367 392 367 C392 367 381 356 381 347 C381 341 386 336 392 336 Z" fill="url(#mepGold)"/>
<circle cx="392" cy="347" r="3" fill="white"/>

<!-- Check de validación nacional -->
<circle cx="414" cy="376" r="10" fill="url(#mepBlue)"/>
<path d="M410 376 L413 379 L419 372" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Base -->
<g filter="url(#shadow)">
<rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"/>
</g>

</svg>