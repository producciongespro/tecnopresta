<circle cx="142" cy="380" r="12" fill="url(#mepGold)"/>
<path d="M137 380 L140 383 L147 375" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Panel Inferior Central: Archivo de Documentos -->
<g filter="url(#shadow)">
<rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"/>

<!-- Folder 1 -->
<path d="M226 340 L240 340 L244 346 L274 346 L274 370 L226 370 Z" fill="white"/>
