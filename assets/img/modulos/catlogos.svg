<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Catalog Panel -->
<g filter="url(#shadow)">

  <rect x="150" y="122" width="212" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Folder Tabs -->
  <rect x="178" y="142" width="42" height="22" rx="6" fill="white"></rect>

  <rect x="234" y="142" width="42" height="22" rx="6" fill="#D2B06C"></rect>

  <rect x="290" y="142" width="42" height="22" rx="6" fill="#C7CED4"></rect>

  <!-- Lines -->
  <rect x="178" y="182" width="126" height="8" rx="4" fill="white" opacity="0.95"></rect>

  <rect x="178" y="202" width="98" height="8" rx="4" fill="white" opacity="0.8"></rect>

  <!-- Gear -->
  <circle cx="316" cy="204" r="18" fill="url(#mepGoldSoft)"></circle>

  <circle cx="316" cy="204" r="8" fill="white"></circle>

  <path d="M316 178V186" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M316 222V230" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M290 204H298" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M334 204H342" stroke="white" stroke-width="3" stroke-linecap="round"></path>

</g>

<!-- Asset Types -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Monitor -->
  <rect x="94" y="334" width="52" height="34" rx="6" fill="white"></rect>

  <rect x="114" y="370" width="12" height="8" rx="3" fill="white"></rect>

  <rect x="102" y="378" width="36" height="6" rx="3" fill="white"></rect>

</g>

<!-- Colors & Brands -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Palette -->
  <circle cx="256" cy="354" r="24" fill="white"></circle>

  <circle cx="248" cy="346" r="4" fill="#164687"></circle>
  <circle cx="264" cy="344" r="4" fill="#D2B06C"></circle>
  <circle cx="270" cy="358" r="4" fill="#B3BAC1"></circle>
  <circle cx="252" cy="364" r="4" fill="#2B5DA1"></circle>

  <!-- Brand Label -->
  <rect x="232" y="392" width="48" height="8" rx="4" fill="url(#mepBlueSoft)"></rect>

  <rect x="240" y="406" width="32" height="8" rx="4" fill="url(#mepBlueSoft)" opacity="0.7"></rect>

</g>

<!-- Groups & Alias -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Users -->
  <circle cx="376" cy="348" r="10" fill="white"></circle>

  <circle cx="404" cy="348" r="10" fill="white"></circle>

  <path d="M360 382C364 366 372 360 376 360C380 360 388 366 392 382" fill="white"></path>

  <path d="M388 382C392 366 400 360 404 360C408 360 416 366 420 382" fill="white"></path>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.5"></rect>

</svg>