<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Coordination Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Coordinator -->
  <circle cx="256" cy="166" r="18" fill="white"></circle>

  <path d="M228 216C234 192 244 184 256 184C268 184 278 192 284 216" fill="white"></path>

  <!-- Schedule Board -->
  <rect x="292" y="148" width="44" height="52" rx="6" fill="white"></rect>

  <rect x="300" y="160" width="28" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="300" y="172" width="20" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="300" y="184" width="24" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <circle cx="326" cy="184" r="5" fill="url(#mepGoldSoft)"></circle>

  <!-- Assignment Line -->
  <path d="M274 176H292" stroke="#D2B06C" stroke-width="4" stroke-linecap="round"></path>

</g>

<!-- Field Visits -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Map Marker -->
  <path d="M120 330C104 330 94 342 94 356C94 378 120 392 120 392C120 392 146 378 146 356C146 342 136 330 120 330Z" fill="white"></path>

  <circle cx="120" cy="356" r="8" fill="url(#mepBlue)"></circle>

</g>

<!-- Visit Planning -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Calendar -->
  <rect x="230" y="330" width="52" height="62" rx="8" fill="white"></rect>

  <rect x="230" y="330" width="52" height="14" rx="8" fill="url(#mepBlue)"></rect>

  <rect x="240" y="354" width="8" height="8" rx="2" fill="url(#mepGoldSoft)"></rect>

  <rect x="254" y="354" width="8" height="8" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="240" y="368" width="8" height="8" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="254" y="368" width="8" height="8" rx="2" fill="url(#mepBlueSoft)"></rect>

  <!-- Check -->
  <circle cx="282" cy="408" r="10" fill="url(#mepGoldSoft)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Assignment Network -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Coordinator Node -->
  <circle cx="390" cy="348" r="10" fill="white"></circle>

  <!-- Educational Centers -->
  <circle cx="368" cy="382" r="7" fill="white"></circle>

  <circle cx="390" cy="390" r="7" fill="white"></circle>

  <circle cx="412" cy="382" r="7" fill="white"></circle>

  <!-- Connections -->
  <path d="M390 356L368 376" stroke="white" stroke-width="3"></path>

  <path d="M390 358L390 382" stroke="white" stroke-width="3"></path>

  <path d="M390 356L412 376" stroke="white" stroke-width="3"></path>

  <!-- Assignment Indicator -->
  <circle cx="420" cy="336" r="9" fill="url(#mepGoldSoft)"></circle>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>