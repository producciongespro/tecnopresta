<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Ticket Management Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Ticket -->
  <path d="M186 152H326C332 152 336 156 336 162V180C326 180 320 186 320 196C320 206 326 212 336 212V228C336 234 332 238 326 238H186C180 238 176 234 176 228V212C186 212 192 206 192 196C192 186 186 180 176 180V162C176 156 180 152 186 152Z" fill="white"></path>

  <!-- Ticket Number -->
  <rect x="208" y="176" width="56" height="8" rx="4" fill="url(#mepBlueSoft)"></rect>

  <rect x="208" y="194" width="42" height="8" rx="4" fill="url(#mepBlueSoft)"></rect>

  <!-- Status Badge -->
  <circle cx="294" cy="194" r="16" fill="url(#mepGoldSoft)"></circle>

  <path d="M287 194L293 200L303 188" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Ticket History -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Clock -->
  <circle cx="120" cy="360" r="24" fill="white"></circle>

  <path d="M120 346V360L132 368" stroke="url(#mepBlue)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Ticket Registry -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Document -->
  <rect x="232" y="328" width="48" height="70" rx="8" fill="white"></rect>

  <rect x="242" y="344" width="26" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="358" width="20" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="372" width="24" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="386" width="18" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- History Seal -->
  <circle cx="282" cy="408" r="10" fill="url(#mepGoldSoft)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Ticket Status Tracking -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Workflow Nodes -->
  <circle cx="366" cy="360" r="7" fill="white"></circle>

  <circle cx="390" cy="360" r="7" fill="url(#mepGoldSoft)"></circle>

  <circle cx="414" cy="360" r="7" fill="white"></circle>

  <!-- Flow Lines -->
  <path d="M373 360H383" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <path d="M397 360H407" stroke="white" stroke-width="3" stroke-linecap="round"></path>

  <!-- Progress Arrow -->
  <path d="M404 352L414 360L404 368" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>