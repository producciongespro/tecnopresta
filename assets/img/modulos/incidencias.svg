<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#164687"></stop>
<stop offset="100%" stop-color="#021A53"></stop>
</linearGradient>

<linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2D67B1"></stop>
<stop offset="100%" stop-color="#164687"></stop>
</linearGradient>

<linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#CFAC65"></stop>
<stop offset="100%" stop-color="#B89243"></stop>
</linearGradient>

<linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#D7DBDF"></stop>
<stop offset="100%" stop-color="#B3BAC1"></stop>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
</filter>

</defs>

<!-- Dashboard -->

<g filter="url(#shadow)">
<rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->

<g filter="url(#shadow)">
<rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
<circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Ticket Principal -->

<g filter="url(#shadow)">

<rect x="165" y="132" width="182" height="102" rx="14" fill="url(#mepBlue)"></rect>

<!-- Ticket -->

<path d="M205 152
H307
V172
C297 172 289 180 289 190
C289 200 297 208 307 208
V214
H205
V208
C215 208 223 200 223 190
C223 180 215 172 205 172
V152Z" fill="white"></path>

<!-- Icono incidencia -->

<circle cx="256" cy="190" r="18" fill="url(#mepGold)"></circle>

<path d="M256 180V194" stroke="white" stroke-width="4" stroke-linecap="round"></path>

<circle cx="256" cy="201" r="2.5" fill="white"></circle>

<!-- Numero Ticket -->

<rect x="228" y="220" width="56" height="8" rx="4" fill="white" opacity="0.7"></rect>

</g>

<!-- Registrar Ticket -->

<g filter="url(#shadow)">

<circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

<rect x="95" y="334" width="48" height="56" rx="8" fill="white"></rect>

<circle cx="146" cy="336" r="11" fill="url(#mepGold)"></circle>

<path d="M146 330V342" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

<path d="M140 336H152" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

</g>

<!-- Mis Tickets -->

<g filter="url(#shadow)">

<rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

<circle cx="256" cy="340" r="12" fill="white"></circle>

<path d="M238 374C244 362 249 356 256 356C263 356 268 362 274 374" stroke="white" stroke-width="4" stroke-linecap="round"></path>

<rect x="234" y="392" width="44" height="8" rx="4" fill="url(#mepBlueSoft)"></rect>

<circle cx="282" cy="408" r="10" fill="url(#mepGold)"></circle>

<path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Seguimiento -->

<g filter="url(#shadow)">

<circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

<!-- Lupa -->

<circle cx="386" cy="354" r="16" fill="white"></circle>

<circle cx="386" cy="354" r="7" fill="url(#mepGold)"></circle>

<path d="M397 365L408 376" stroke="white" stroke-width="4" stroke-linecap="round"></path>

<!-- Ticket -->

<rect x="404" y="330" width="18" height="30" rx="3" fill="white"></rect>

</g>

<!-- Base -->

<rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>

<!-- Franja lateral -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>