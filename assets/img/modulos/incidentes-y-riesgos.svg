<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Laptop / Monitoring Screen -->
<g filter="url(#shadow)">
  <rect x="152" y="126" width="208" height="118" rx="14" fill="url(#mepBlue)"></rect>

  <!-- Alert Triangle -->
  <path d="M256 148L302 222H210L256 148Z" fill="white"></path>

  <rect x="251" y="176" width="10" height="28" rx="4" fill="url(#mepBlue)"></rect>

  <rect x="251" y="210" width="10" height="10" rx="4" fill="url(#mepBlue)"></rect>
</g>

<!-- Incident Tracking Nodes -->
<g filter="url(#shadow)">

  <circle cx="126" cy="350" r="46" fill="url(#mepBlueSoft)"></circle>

  <circle cx="126" cy="350" r="18" stroke="white" stroke-width="5"></circle>

  <path d="M144 368L168 392" stroke="white" stroke-width="6" stroke-linecap="round"></path>

</g>

<!-- Stolen Device -->
<g filter="url(#shadow)">

  <rect x="210" y="310" width="92" height="140" rx="18" fill="url(#mepBlue)"></rect>

  <rect x="225" y="330" width="62" height="82" rx="8" fill="white" opacity="0.95"></rect>

  <path d="M226 414L286 354" stroke="#D2B06C" stroke-width="8" stroke-linecap="round"></path>

  <circle cx="256" cy="384" r="26" stroke="#D2B06C" stroke-width="8"></circle>

</g>

<!-- Critical Incident Shield -->
<g filter="url(#shadow)">

  <path d="M388 314L430 330V360C430 388 412 406 388 416C364 406 346 388 346 360V330L388 314Z" fill="url(#mepBlueSoft)"></path>

  <path d="M388 338V364" stroke="white" stroke-width="6" stroke-linecap="round"></path>

  <circle cx="388" cy="382" r="4" fill="white"></circle>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="110" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.75"></rect>

</svg>