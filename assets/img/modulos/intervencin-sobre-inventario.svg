<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard Principal -->
<g filter="url(#shadow)">
  <rect x="110" y="82" width="292" height="208" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->
<g filter="url(#shadow)">
  <rect x="198" y="48" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="69" r="7" fill="white"></circle>
</g>

<!-- Inventario Central -->
<g filter="url(#shadow)">
  <rect x="150" y="124" width="212" height="118" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Centro Educativo -->
  <path d="M256 148L210 170H302L256 148Z" fill="white"></path>

  <rect x="220" y="174" width="10" height="34" rx="2" fill="white"></rect>

  <rect x="250" y="174" width="12" height="34" rx="2" fill="white"></rect>

  <rect x="282" y="174" width="10" height="34" rx="2" fill="white"></rect>

  <rect x="206" y="214" width="100" height="8" rx="4" fill="white"></rect>

  <!-- Activos -->
  <circle cx="188" cy="192" r="12" fill="url(#mepGold)"></circle>

  <rect x="320" y="182" width="18" height="14" rx="3" fill="url(#mepGold)"></rect>

  <!-- Conexiones -->
  <path d="M200 192H220" stroke="white" stroke-width="3"></path>

  <path d="M292 190H320" stroke="white" stroke-width="3"></path>

</g>

<!-- Registro Masivo -->
<g filter="url(#shadow)">
  <circle cx="118" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="92" y="336" width="18" height="18" rx="3" fill="white"></rect>
  <rect x="118" y="336" width="18" height="18" rx="3" fill="white"></rect>
  <rect x="92" y="362" width="18" height="18" rx="3" fill="white"></rect>
  <rect x="118" y="362" width="18" height="18" rx="3" fill="white"></rect>

  <circle cx="142" cy="336" r="10" fill="url(#mepGold)"></circle>

  <path d="M142 330V342M136 336H148" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>
</g>

<!-- Intervención -->
<g filter="url(#shadow)">
  <rect x="214" y="308" width="84" height="126" rx="16" fill="url(#mepGray)"></rect>

  <!-- Placa -->
  <rect x="228" y="328" width="56" height="34" rx="6" fill="white"></rect>

  <rect x="238" y="340" width="36" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- Herramienta -->
  <circle cx="256" cy="398" r="18" fill="url(#mepGold)"></circle>

  <path d="M250 392L262 404" stroke="white" stroke-width="3.5" stroke-linecap="round"></path>

  <path d="M262 392L250 404" stroke="white" stroke-width="3.5" stroke-linecap="round"></path>

</g>

<!-- Ubicación y Localización -->
<g filter="url(#shadow)">
  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Pin -->
  <path d="M392 330C376 330 366 342 366 356C366 378 392 392 392 392C392 392 418 378 418 356C418 342 408 330 392 330Z" fill="white"></path>

  <circle cx="392" cy="356" r="8" fill="url(#mepBlue)"></circle>

  <!-- Flecha redistribución -->
  <path d="M356 404H418" stroke="url(#mepGold)" stroke-width="4" stroke-linecap="round"></path>

  <path d="M408 396L418 404L408 412" stroke="url(#mepGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Barra Decorativa -->
<rect x="110" y="116" width="14" height="146" rx="7" fill="url(#mepGold)" opacity="0.35"></rect>

</svg>