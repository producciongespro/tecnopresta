<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Top Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main Support Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Engineer -->
  <circle cx="256" cy="166" r="22" fill="white"></circle>

  <path d="M224 220C230 192 242 184 256 184C270 184 282 192 288 220" fill="white"></path>

  <!-- Headset -->
  <path d="M230 164C230 148 242 136 256 136C270 136 282 148 282 164" stroke="#D2B06C" stroke-width="5" stroke-linecap="round"></path>

  <rect x="224" y="160" width="8" height="18" rx="4" fill="#D2B06C"></rect>

  <rect x="280" y="160" width="8" height="18" rx="4" fill="#D2B06C"></rect>

  <path d="M282 174H296" stroke="#D2B06C" stroke-width="4" stroke-linecap="round"></path>

  <circle cx="300" cy="174" r="4" fill="#D2B06C"></circle>

</g>

<!-- Technical Support -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Wrench -->
  <path d="M104 334C112 326 122 326 128 332L120 340L138 358L146 350C152 356 152 366 144 374C136 382 124 382 118 376L104 362C98 356 98 344 104 334Z" fill="white"></path>

</g>

<!-- Engineer Management -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- User -->
  <circle cx="256" cy="346" r="14" fill="url(#mepBlue)"></circle>

  <path d="M234 390C238 370 246 362 256 362C266 362 274 370 278 390" fill="url(#mepBlue)"></path>

  <!-- Gear -->
  <circle cx="278" cy="404" r="12" fill="url(#mepGoldSoft)"></circle>

  <circle cx="278" cy="404" r="5" fill="white"></circle>

  <path d="M278 388V392" stroke="white" stroke-width="2" stroke-linecap="round"></path>

  <path d="M278 416V420" stroke="white" stroke-width="2" stroke-linecap="round"></path>

  <path d="M262 404H266" stroke="white" stroke-width="2" stroke-linecap="round"></path>

  <path d="M290 404H294" stroke="white" stroke-width="2" stroke-linecap="round"></path>

</g>

<!-- Service Network -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Central Engineer -->
  <circle cx="390" cy="360" r="10" fill="white"></circle>

  <!-- Nodes -->
  <circle cx="368" cy="336" r="6" fill="white"></circle>

  <circle cx="412" cy="336" r="6" fill="white"></circle>

  <circle cx="368" cy="384" r="6" fill="white"></circle>

  <circle cx="412" cy="384" r="6" fill="white"></circle>

  <!-- Connections -->
  <path d="M390 360L368 336" stroke="white" stroke-width="3"></path>

  <path d="M390 360L412 336" stroke="white" stroke-width="3"></path>

  <path d="M390 360L368 384" stroke="white" stroke-width="3"></path>

  <path d="M390 360L412 384" stroke="white" stroke-width="3"></path>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.40"></rect>

</svg>