<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Paleta Institucional MEP -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D67B1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#CFAC65"></stop>
    <stop offset="100%" stop-color="#B89243"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
  </filter>

</defs>

<!-- Dashboard Principal -->

<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->

<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Prestamo de Activos -->

<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Laptop -->

  <rect x="178" y="152" width="52" height="34" rx="5" fill="white"></rect>

  <rect x="184" y="158" width="40" height="22" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="170" y="188" width="68" height="8" rx="4" fill="white"></rect>

  <!-- Flecha de préstamo -->

  <circle cx="256" cy="182" r="24" fill="url(#mepGold)"></circle>

  <path d="M244 182H266" stroke="white" stroke-width="4" stroke-linecap="round"></path>

  <path d="M260 176L268 182L260 188" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Usuario receptor -->

  <circle cx="322" cy="170" r="14" fill="white"></circle>

  <circle cx="322" cy="164" r="4" fill="url(#mepBlueSoft)"></circle>

  <path d="M314 176C316 172 319 170 322 170C325 170 328 172 330 176" stroke="url(#mepBlueSoft)" stroke-width="2.2" stroke-linecap="round"></path>

  <!-- Ticket de solicitud -->

  <rect x="300" y="190" width="44" height="24" rx="5" fill="white"></rect>

  <rect x="308" y="198" width="28" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <rect x="308" y="205" width="18" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

</g>

<!-- Registro de Prestamo -->

<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <rect x="94" y="334" width="50" height="58" rx="8" fill="white"></rect>

  <rect x="106" y="350" width="24" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <rect x="106" y="362" width="28" height="4" rx="2" fill="url(#mepBlueSoft)"></rect>

  <circle cx="148" cy="336" r="10" fill="url(#mepGold)"></circle>

  <path d="M148 330V342" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M142 336H154" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

</g>

<!-- Aprobacion de Solicitudes -->

<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <rect x="232" y="334" width="48" height="34" rx="6" fill="white"></rect>

  <rect x="242" y="346" width="28" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="354" width="20" height="3" rx="1.5" fill="url(#mepBlueSoft)"></rect>

  <!-- Check aprobación -->

  <circle cx="256" cy="390" r="14" fill="url(#mepGold)"></circle>

  <path d="M250 390L255 395L264 384" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Consulta de Activos Prestados -->

<g filter="url(#shadow)">

  <circle cx="392" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Laptop -->

  <rect x="372" y="344" width="30" height="18" rx="3" fill="white"></rect>

  <rect x="366" y="364" width="42" height="5" rx="2.5" fill="white"></rect>

  <!-- Lupa -->

  <circle cx="416" cy="384" r="12" fill="url(#mepGold)"></circle>

  <circle cx="416" cy="384" r="5" fill="white"></circle>

  <path d="M421 389L428 396" stroke="white" stroke-width="2" stroke-linecap="round"></path>

</g>

<!-- Base -->

<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Franja Institucional -->

<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGold)" opacity="0.30"></rect>

</svg>