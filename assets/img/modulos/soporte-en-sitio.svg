<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- MEP Palette -->
  <linearGradient id="mepBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#164687"></stop>
    <stop offset="100%" stop-color="#021A53"></stop>
  </linearGradient>

  <linearGradient id="mepBlueSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B5DA1"></stop>
    <stop offset="100%" stop-color="#164687"></stop>
  </linearGradient>

  <linearGradient id="mepGoldSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D2B06C"></stop>
    <stop offset="100%" stop-color="#BC9A56"></stop>
  </linearGradient>

  <linearGradient id="mepGray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D7DBDF"></stop>
    <stop offset="100%" stop-color="#B3BAC1"></stop>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14"></feDropShadow>
  </filter>

</defs>

<!-- Main Dashboard -->
<g filter="url(#shadow)">
  <rect x="108" y="78" width="296" height="214" rx="22" fill="white" stroke="#021A53" stroke-width="6"></rect>
</g>

<!-- Header -->
<g filter="url(#shadow)">
  <rect x="198" y="46" width="116" height="42" rx="14" fill="url(#mepBlue)"></rect>
  <circle cx="256" cy="67" r="7" fill="white"></circle>
</g>

<!-- Main On-Site Support Panel -->
<g filter="url(#shadow)">

  <rect x="148" y="122" width="216" height="122" rx="16" fill="url(#mepBlue)"></rect>

  <!-- Educational Center -->
  <path d="M188 156L256 184L324 156V166L256 194L188 166V156Z" fill="white"></path>

  <rect x="226" y="198" width="60" height="26" rx="4" fill="white"></rect>

  <!-- Support Technician -->
  <circle cx="308" cy="206" r="16" fill="url(#mepGoldSoft)"></circle>

  <circle cx="308" cy="198" r="5" fill="white"></circle>

  <path d="M300 212C302 206 305 204 308 204C311 204 314 206 316 212" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Ticket Connection -->
  <path d="M292 206H274" stroke="white" stroke-width="3" stroke-linecap="round"></path>

</g>

<!-- Assigned Tickets -->
<g filter="url(#shadow)">

  <circle cx="120" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Ticket -->
  <path d="M92 340H148C152 340 156 344 156 348V356C150 356 146 360 146 366C146 372 150 376 156 376V384C156 388 152 392 148 392H92C88 392 84 388 84 384V376C90 376 94 372 94 366C94 360 90 356 84 356V348C84 344 88 340 92 340Z" fill="white"></path>

  <rect x="102" y="356" width="32" height="5" rx="2.5" fill="url(#mepBlueSoft)"></rect>

  <rect x="102" y="370" width="22" height="5" rx="2.5" fill="url(#mepBlueSoft)"></rect>

</g>

<!-- Service Registration -->
<g filter="url(#shadow)">

  <rect x="214" y="312" width="84" height="122" rx="16" fill="url(#mepGray)"></rect>

  <!-- Service Report -->
  <rect x="230" y="328" width="52" height="72" rx="8" fill="white"></rect>

  <rect x="242" y="344" width="26" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="358" width="20" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <rect x="242" y="372" width="24" height="6" rx="3" fill="url(#mepBlueSoft)"></rect>

  <!-- Registration Seal -->
  <circle cx="282" cy="408" r="10" fill="url(#mepGoldSoft)"></circle>

  <path d="M278 408L281 411L286 404" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Ticket Closure -->
<g filter="url(#shadow)">

  <circle cx="390" cy="360" r="52" fill="url(#mepBlueSoft)"></circle>

  <!-- Open Ticket -->
  <path d="M364 342H416C420 342 424 346 424 350V356C418 356 414 360 414 366C414 372 418 376 424 376V382C424 386 420 390 416 390H364C360 390 356 386 356 382V376C362 376 366 372 366 366C366 360 362 356 356 356V350C356 346 360 342 364 342Z" fill="white"></path>

  <!-- Closed Check -->
  <circle cx="414" cy="338" r="11" fill="url(#mepGoldSoft)"></circle>

  <path d="M409 338L413 342L420 334" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>

</g>

<!-- Bottom Base -->
<g filter="url(#shadow)">
  <rect x="168" y="448" width="176" height="28" rx="12" fill="url(#mepBlue)"></rect>
</g>

<!-- Decorative Accent -->
<rect x="108" y="112" width="14" height="150" rx="7" fill="url(#mepGoldSoft)" opacity="0.35"></rect>

</svg>