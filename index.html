    <style>
      :root {
        --tp-navy: #1d2958;
        --tp-navy-dark: #121b3b;
        --tp-blue-accent: #00baed;
        --tp-gold: #cc9c48;
        --tp-gold-light: #e5b96a;
        --tp-gold-dark: #a87e32;
        --tp-bg-gradient: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--tp-bg-gradient);
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #333333;
        overflow-x: hidden;
        position: relative;
      }

      /* =========================================================
         BARRA SUPERIOR / CINTILLO INSTITUCIONAL
         Color azul sólido institucional (#1d2958) sin mapitas ni mouse
         ========================================================= */
      .cintillo-wrapper {
        width: 100%;
        background: #1d2958;
        line-height: 0;
        position: relative;
        box-shadow: 0 4px 15px rgba(29, 41, 88, 0.25);
        z-index: 20;
        overflow: hidden;
      }

      .cintillo-svg {
        width: 100%;
        height: 64px;
        display: block;
        object-fit: cover;
      }

      @media (min-width: 768px) {
        .cintillo-svg { height: 72px; }
      }
      @media (min-width: 1200px) {
        .cintillo-svg { height: 80px; }
      }
      @media (max-width: 576px) {
        .cintillo-svg { height: 52px; }
      }

      /* TOP TOOLBAR: Botón de Notificaciones */
      .top-toolbar {
        position: absolute;
        top: 10px;
        right: 15px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-notification {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #ffffff;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        backdrop-filter: blur(4px);
        transition: all 0.25s ease;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }

      .btn-notification:hover {
        background: rgba(255, 255, 255, 0.3);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      /* ESCENARIO PRINCIPAL */
      .main-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.2rem 1.5rem 3.5rem 1.5rem;
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      .hero-zone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 900px;
      }

      /* LOGO CENTRAL TECNOPRESTA */
      .logo-container {
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        filter: drop-shadow(0 12px 24px rgba(29, 41, 88, 0.12));
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        will-change: transform;
        position: relative;
        z-index: 5;
      }

      .logo-container:hover {
        transform: translateY(-4px) scale(1.02);
      }

      .logo-gear-svg {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (min-width: 768px) {
        .logo-container { max-width: 350px; }
      }
      @media (min-width: 1200px) {
        .logo-container { max-width: 380px; }
      }
      @media (max-width: 480px) {
        .logo-container { max-width: 250px; }
      }

      /* =========================================================
         CONCEPTOS FLOTANTES SUAVES & ELEGANTES
         z-index: 15 (SIEMPRE AL FRENTE DE CUALQUIER TEXTO O ELEMENTO)
         ========================================================= */
      .concept-pill {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 50px;
        font-size: 0.84rem;
        font-weight: 600;
        letter-spacing: 0.25px;
        box-shadow: 0 10px 30px rgba(29, 41, 88, 0.12), 0 2px 8px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: none;
        opacity: 0;
        z-index: 15;
        white-space: nowrap;
        will-change: opacity, transform, filter;
      }

      .concept-icon-wrap {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.82rem;
      }

      /* 1. Tiquetes de incidencias (Superior Izquierda) */
      .concept-1 {
        top: 10%;
        left: 5%;
        color: #1d2958;
        border: 1px solid rgba(0, 186, 237, 0.35);
        border-left: 4px solid #00baed;
        animation: elegantCycleOne 15s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .concept-1 .concept-icon-wrap {
        background: rgba(0, 186, 237, 0.14);
        color: #008eb7;
      }

      /* 2. Inventario Nacional (Superior Derecha) */
      .concept-2 {
        top: 14%;
        right: 4%;
        color: #1d2958;
        border: 1px solid rgba(204, 156, 72, 0.35);
        border-right: 4px solid #cc9c48;
        animation: elegantCycleTwo 15s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .concept-2 .concept-icon-wrap {
        background: rgba(204, 156, 72, 0.15);
        color: #a87e32;
      }

      /* 3. Préstamos Activos Tecnológicos (Inferior Delante del Logo / Título) */
      .concept-3 {
        bottom: 25px;
        right: 3%;
        color: #1d2958;
        border: 1px solid rgba(22, 70, 135, 0.35);
        border-left: 4px solid #164687;
        animation: elegantCycleThree 15s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .concept-3 .concept-icon-wrap {
        background: rgba(22, 70, 135, 0.14);
        color: #164687;
      }

      /* Coreografía suave desfasada */
      @keyframes elegantCycleOne {
        0% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(-15px, 0, 0) scale(0.97);
        }
        4% { opacity: 0; filter: blur(3px); }
        9%, 28% {
          opacity: 1;
          filter: blur(0px);
          transform: translate3d(0, 0, 0) scale(1);
          box-shadow: 0 14px 34px rgba(0, 186, 237, 0.18), 0 3px 8px rgba(0, 0, 0, 0.05);
        }
        33% {
          opacity: 0;
          filter: blur(4px);
          transform: translate3d(8px, -6px, 0) scale(0.98);
        }
        34%, 100% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(-15px, 0, 0) scale(0.97);
        }
      }

      @keyframes elegantCycleTwo {
        0%, 33% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(15px, 0, 0) scale(0.97);
        }
        37% { opacity: 0; filter: blur(3px); }
        42%, 61% {
          opacity: 1;
          filter: blur(0px);
          transform: translate3d(0, 0, 0) scale(1);
          box-shadow: 0 14px 34px rgba(204, 156, 72, 0.18), 0 3px 8px rgba(0, 0, 0, 0.05);
        }
        66% {
          opacity: 0;
          filter: blur(4px);
          transform: translate3d(-8px, -6px, 0) scale(0.98);
        }
        67%, 100% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(15px, 0, 0) scale(0.97);
        }
      }

      @keyframes elegantCycleThree {
        0%, 66% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(15px, 8px, 0) scale(0.97);
        }
        70% { opacity: 0; filter: blur(3px); }
        75%, 94% {
          opacity: 1;
          filter: blur(0px);
          transform: translate3d(0, 0, 0) scale(1);
          box-shadow: 0 14px 34px rgba(22, 70, 135, 0.22), 0 3px 8px rgba(0, 0, 0, 0.06);
        }
        99% {
          opacity: 0;
          filter: blur(4px);
          transform: translate3d(-6px, -6px, 0) scale(0.98);
        }
        100% {
          opacity: 0;
          filter: blur(5px);
          transform: translate3d(15px, 8px, 0) scale(0.97);
        }
      }

      @media (max-width: 768px) {
        .concept-pill {
          font-size: 0.76rem;
          padding: 7px 15px;
        }
        .concept-icon-wrap {
          width: 25px;
          height: 25px;
          font-size: 0.74rem;
        }
        .concept-1 { top: 2%; left: 2%; }
        .concept-2 { top: 2%; right: 2%; }
        .concept-3 { bottom: 10px; right: 2%; }
      }

      @media (max-width: 520px) {
        .concept-1 { top: -8px; left: 50%; transform: translateX(-50%); }
        .concept-2 { top: auto; bottom: 80px; left: 50%; transform: translateX(-50%); }
        .concept-3 { bottom: 15px; left: 50%; transform: translateX(-50%); right: auto; }
        
        @keyframes elegantCycleOne {
          0%, 4% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, -8px, 0) scale(0.96); }
          9%, 28% { opacity: 1; filter: blur(0px); transform: translate3d(-50%, 0, 0) scale(1); }
          33%, 100% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, 8px, 0) scale(0.96); }
        }
        @keyframes elegantCycleTwo {
          0%, 36% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, -8px, 0) scale(0.96); }
          41%, 60% { opacity: 1; filter: blur(0px); transform: translate3d(-50%, 0, 0) scale(1); }
          65%, 100% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, 8px, 0) scale(0.96); }
        }
        @keyframes elegantCycleThree {
          0%, 69% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, -8px, 0) scale(0.96); }
          74%, 93% { opacity: 1; filter: blur(0px); transform: translate3d(-50%, 0, 0) scale(1); }
          98%, 100% { opacity: 0; filter: blur(4px); transform: translate3d(-50%, 8px, 0) scale(0.96); }
        }
      }

      /* =========================================================
         BOTÓN PRINCIPAL DEL LOGIN (HERO ANIMADO)
         ========================================================= */
      .action-container {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        z-index: 10;
      }

      .btn-login-hero {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 1rem 2.8rem;
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        background: linear-gradient(135deg, #1d2958 0%, #164687 50%, #cc9c48 100%);
        background-size: 200% 200%;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 10px 25px -4px rgba(29, 41, 88, 0.45), 0 0 20px rgba(204, 156, 72, 0.3);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        animation: gradientShift 4s ease infinite, pulseGlow 2.5s infinite;
        overflow: hidden;
        letter-spacing: 0.5px;
      }

      .btn-login-hero::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -60%;
        width: 40%;
        height: 200%;
        background: linear-gradient(
          60deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.45) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(25deg);
        animation: sweepGlint 3.2s infinite cubic-bezier(0.19, 1, 0.22, 1);
      }

      .btn-login-hero:hover {
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 16px 32px -4px rgba(29, 41, 88, 0.5), 0 0 30px rgba(204, 156, 72, 0.55);
        color: #ffffff;
      }

      .btn-login-hero:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 0 6px 16px rgba(29, 41, 88, 0.4);
      }

      .btn-login-hero .hero-icon {
        font-size: 1.3rem;
        transition: transform 0.3s ease;
      }

      .btn-login-hero:hover .hero-icon {
        transform: translateX(4px);
      }

      .hero-subtitle {
        margin-top: 0.6rem;
        font-size: 0.85rem;
        color: #6b7280;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .hero-subtitle .status-dot {
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 6px #10b981;
        animation: blinkDot 2s infinite;
      }

      /* ANIMACIONES BASE */
      @keyframes sweepGlint {
        0% { left: -60%; }
        35% { left: 140%; }
        100% { left: 140%; }
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 10px 25px -4px rgba(29, 41, 88, 0.45), 0 0 18px rgba(204, 156, 72, 0.25);
        }
        50% {
          box-shadow: 0 12px 30px -3px rgba(29, 41, 88, 0.55), 0 0 28px rgba(204, 156, 72, 0.45);
        }
      }

      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      @media (max-width: 576px) {
        .main-stage { padding: 1.5rem 1rem 3rem 1rem; }
        .btn-login-hero {
          width: 100%;
          max-width: 290px;
          padding: 0.9rem 1.6rem;
          font-size: 1.12rem;
        }
      }
    </style>
  </head>

    <script>
      /* ============================================
      * CARGADOR DINÁMICO DE LOGIN
      * ============================================
      * Carga el JS SOLO cuando se necesita
      */
      window.tipoLoginActivo = null; ////carga en la variable el tipo de login, inicializa en null
      function cargarScriptLogin(ruta, callback) {

          // ============================================
          // Si YA existe el script cargado
          // ============================================
          const scriptExistente = document.querySelector(
              `script[src="${ruta}"]`
          );

          if (scriptExistente) {

              console.log("⚠️ Script ya cargado:", ruta);

              // Ejecuta callback directamente
              if (callback) callback();

              return;
          }
          
          if (document.getElementById("loginScript")) { //Si ya hay un script de login cargado, lo elimina para evitar conflictos
              document.getElementById("loginScript").remove(); // Elimina el script existente
          }

          // ============================================
          // Crear nuevo script
          // ============================================
          let script = document.createElement("script");
          script.src = ruta;
          script.id = "loginScript";

          script.onload = async function () {
              console.log("✅ Script cargado:", ruta);

              // 🔥 FORZAR INICIALIZACIÓN MANUAL -  // Inicializar MSAL SOLO si existe
              if (typeof initializeMSAL === "function" && !window.msalInicializado) { // Verifica si MSAL ya fue inicializado
                  await initializeMSAL();
                  window.msalInicializado = true; // Marca MSAL como inicializado
              }

              // 🔥 Ejecutar callback después de inicializar
              if (callback) callback();
          };

          document.body.appendChild(script);
      }

      /**
       * ============================================
       * BOTÓN PRINCIPAL (VISIBLE, SIN CONTRASEÑA)
       * Ahora carga la NUEVA VERSIÓN
       * ============================================
       */
      function accesoPrincipal() {

        window.tipoLoginActivo = "especial"; //carga en la variable el tipo de login

        cargarScriptLogin("js/formulario_login_e.js?version=13", function () {

          if (typeof signInEspecial === "function") {
            signInEspecial();
          } else {
            console.error("❌ signInEspecial no está definido");
          }

        });
      }

    /**
     * ============================================
     * BOTÓN OCULTO (CON CONTRASEÑA)
     * Ahora carga la VERSIÓN ANTERIOR (normal)
     * ============================================
    */
    function accesoControlado() {

      const codigo = prompt("Ingrese código de acceso:");
      if (codigo === null) return;

      if (codigo !== "654123") {
        alert("Acceso no autorizado");
        return;
      }

      console.log("✅ Acceso autorizado");

      window.tipoLoginActivo = "normal"; //carga en la variable el tipo de login

      cargarScriptLogin("js/formulario_login.js?version=15", function () {

        if (typeof signIn === "function") {
          signIn();
        } else {
          console.error("❌ signIn no está definido");
        }

      });
    }
    </script>

        registration.pushManager.getSubscription().then(function(subscription) {

            if (subscription) {
                subscription.unsubscribe().then(function() {
                    console.log('Desuscrito con éxito');
                }).catch(function(error) {
                    console.error('Error al desuscribirse:', error);
                });
            }

            // Suscribir nuevamente con la nueva clave
            registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array('BJG5s-2sldzC64tugMXk6xorDxrIcmCMT2J7Wyoq3dFtFshEJ3UvdtUYJ8vGRHl9pepQBZDiaVnH5KDWhlpHvuY')
            }).then(function(subscription) {
                console.log('Usuario suscrito:', subscription);
                // Enviar la suscripción al servidor
                fetch('subscribe.php', {
                    method: 'POST',
                    body: JSON.stringify(subscription),
                    headers: {

                    }
